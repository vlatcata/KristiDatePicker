<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For Kristi 💕</title>
<link rel="stylesheet" href="style.css">

<!-- Browser tab icon (was missing entirely before) -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<!-- PWA: lets it be added to the home screen as an app-like icon -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2d8f">

<!-- iOS ignores the manifest above for home-screen behavior; it needs its own tags -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For Kristi">
</head>
<body>

<div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>
<div class="sparkles" aria-hidden="true">
  <span class="sparkle s1">✦</span>
  <span class="sparkle s2">✦</span>
  <span class="sparkle s3">✦</span>
  <span class="sparkle s4">✦</span>
  <span class="sparkle s5">✦</span>
</div>

<main class="stage">

  <!-- Persists across every screen so the hamster's reaction follows along -->
  <div class="avatar-frame">
    <span class="avatar-placeholder" id="hamsterPlaceholder">🐹</span>
    <img class="avatar-img hidden" id="hamsterImg" alt="">
  </div>

  <!-- SCREEN 1: The Proposal -->
  <section class="screen" id="screen-proposal" data-screen>
    <h1 class="title">Kristi, will you go<br>out with me?</h1>
    <div class="sad-messages" id="sadMessages" aria-live="polite"></div>
    <div class="button-row" id="proposalButtons">
      <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
  </section>

  <!-- SCREEN 2: Pick a date type -->
  <section class="screen hidden" id="screen-type" data-screen>
    <h2 class="title">Yay!! 🎉 Pick a type of date:</h2>
    <div class="options-grid" id="typeOptions">
      <button class="option-card" data-value="Dinner">🍝<span>Dinner</span></button>
      <button class="option-card" data-value="Movie">🎬<span>Movie</span></button>
      <button class="option-card" data-value="Picnic">🧺<span>Picnic</span></button>
      <button class="option-card" data-value="Adventure / Hiking">🥾<span>Adventure</span></button>
      <button class="option-card" data-value="Surprise me">🎁<span>Surprise me</span></button>
    </div>
  </section>

  <!-- SCREEN 3: Pick a date -->
  <section class="screen hidden" id="screen-date" data-screen>
    <h2 class="title">Perfect choice 😍 Now, when?</h2>
    <p class="subtitle">Pick a day on the calendar:</p>
    <div class="calendar" id="calendar">
      <div class="calendar-header">
        <button class="cal-nav" id="prevMonth" aria-label="Previous month" type="button">‹</button>
        <span class="cal-month-label" id="monthLabel"></span>
        <button class="cal-nav" id="nextMonth" aria-label="Next month" type="button">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <button class="btn btn-yes" id="confirmDateBtn" disabled>Continue 💌</button>
  </section>

  <!-- SCREEN 4: Confirmation -->
  <section class="screen hidden" id="screen-confirm" data-screen>
    <h2 class="title">It's a date! 💕</h2>
    <p class="confirm-summary" id="confirmSummary"></p>
    <p class="subtitle" id="sendStatus">Letting him know now...</p>
    <div class="reveal hidden" id="revealSection">
      <p class="reveal-text">You know what happens after...</p>
      <div class="reveal-frame">
        <img class="reveal-img" src="assets/hamsters/perv.jpg" alt="">
      </div>
    </div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </section>

</main>

<script src="script.js" defer></script>
</body>
</html>
